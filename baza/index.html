<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>База бригад</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1d21; --muted:#6b7280; --line:#e3e6ea; --accent:#1565c0; --danger:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121417; --card:#1c1f24; --text:#e8eaed; --muted:#9aa0a6; --line:#2c3036; --accent:#64a9f5; --danger:#ef7070; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:4px 0 12px; }
  .tabs { display:flex; gap:8px; margin-bottom:10px; }
  .tabs button { flex:1; }
  button, input, textarea { font:inherit; color:inherit; }
  button { border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer; }
  button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); }
  input, textarea { width:100%; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:8px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .code { font-size:22px; font-weight:700; letter-spacing:1px; }
  .muted { color:var(--muted); font-size:13px; }
  .hidden { display:none; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  a { color:var(--accent); }
  #fab { position:fixed; right:20px; bottom:20px; width:56px; height:56px; border-radius:28px; font-size:28px; padding:0; }
</style>
</head>
<body>
<main>
  <section id="login" class="hidden">
    <h1>База бригад</h1>
    <p class="muted">Коды домофонов и телефоны сотрудников. Пароль — у бригадира.</p>
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password">
    <label for="me">Ваше имя (видно, кто добавил запись)</label>
    <input id="me" placeholder="Например: Зозуля А.">
    <p><button class="primary" id="enter">Войти</button></p>
    <p id="loginErr" class="muted"></p>
  </section>

  <section id="app" class="hidden">
    <div class="row" style="margin-bottom:10px">
      <h1 style="margin:0">База бригад</h1>
      <button id="logout" style="flex:0 0 auto">Выйти</button>
    </div>
    <div class="tabs">
      <button id="tabDoor" class="on">🚪 Домофоны</button>
      <button id="tabPerson">📞 Сотрудники</button>
    </div>
    <input id="q" type="search" placeholder="Поиск">
    <p id="status" class="muted"></p>
    <div id="list"></div>
  </section>

  <section id="edit" class="hidden">
    <h1 id="editTitle"></h1>
    <div id="doorFields">
      <label for="fAddr">Адрес</label><input id="fAddr" placeholder="ст-ца Каневская, ул. Горького, 5">
      <label for="fEntr">Подъезд</label><input id="fEntr" placeholder="1">
      <label for="fCode">Код</label><input id="fCode" placeholder="1234B или 12#3456">
    </div>
    <div id="personFields">
      <label for="fName">ФИО</label><input id="fName">
      <label for="fPhone">Телефон</label><input id="fPhone" type="tel">
      <label for="fRole">Должность / бригада</label><input id="fRole">
    </div>
    <label for="fNote">Примечание</label><textarea id="fNote" rows="2"></textarea>
    <p class="row">
      <button id="cancel">Отмена</button>
      <button id="del" class="danger">Удалить</button>
      <button id="save" class="primary">Сохранить</button>
    </p>
  </section>
</main>
<button id="fab" class="primary hidden" aria-label="Добавить">+</button>

<script>
const API = '/api/baza.php';
const $ = id => document.getElementById(id);
let items = [], tab = 'door', editing = null;

function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

function show(id) {
  for (const s of ['login', 'app', 'edit']) $(s).classList.toggle('hidden', s !== id);
  $('fab').classList.toggle('hidden', id !== 'app');
}

async function call(method, body) {
  const r = await fetch(API, {
    method, headers: { 'X-Key': load('baza_pw'), 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined, cache: 'no-store'
  });
  if (r.status === 403) throw new Error('key');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  items = data.items || [];
  store('baza_cache', JSON.stringify(items));
}

// Поиск без «ул.», «д.», «ст-ца»…: «горького 5» найдёт «ст-ца Каневская, ул. Горького, д. 5»
const STOP = new Set(['ст-ца', 'станица', 'ул', 'улица', 'пер', 'переулок', 'д', 'дом', 'х', 'хутор', 'пос', 'подъезд']);
const norm = s => (s || '').toLowerCase().replace(/ё/g, 'е').replace(/[.,]/g, ' ')
  .split(/\s+/).filter(w => w && !STOP.has(w)).join(' ');

function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render() {
  $('tabDoor').classList.toggle('on', tab === 'door');
  $('tabPerson').classList.toggle('on', tab === 'person');
  const q = norm($('q').value).split(' ').filter(Boolean);
  const list = items.filter(it => it.type === tab && !it.del)
    .filter(it => {
      const hay = norm([it.addr, it.entr, it.code, it.name, it.phone, it.role, it.note].join(' '));
      return q.every(w => hay.includes(w));
    })
    .sort((a, b) => (a.addr || a.name || '').localeCompare(b.addr || b.name || '', 'ru'));
  $('list').innerHTML = list.map(it => tab === 'door'
    ? `<div class="card" data-id="${esc(it.id)}">
         <div>${esc(it.addr)}${it.entr ? ', подъезд ' + esc(it.entr) : ''}</div>
         <div class="code">${esc(it.code) || '—'}</div>
         ${it.note ? `<div class="muted">${esc(it.note)}</div>` : ''}
         <div class="muted">${esc(it.by)} · ${new Date(it.at).toLocaleDateString('ru-RU')}</div>
       </div>`
    : `<div class="card" data-id="${esc(it.id)}">
         <div><b>${esc(it.name)}</b>${it.role ? ' — ' + esc(it.role) : ''}</div>
         ${it.phone ? `<div><a href="tel:${esc(it.phone.replace(/[^\d+]/g, ''))}">${esc(it.phone)}</a></div>` : ''}
         ${it.note ? `<div class="muted">${esc(it.note)}</div>` : ''}
       </div>`).join('') || '<p class="muted">Ничего не найдено.</p>';
  for (const el of $('list').querySelectorAll('.card')) {
    el.onclick = e => { if (e.target.tagName !== 'A') openEdit(items.find(i => i.id === el.dataset.id)); };
  }
}

async function refresh() {
  $('status').textContent = 'Обновляю…';
  try { await call('GET'); $('status').textContent = ''; }
  catch (e) {
    if (e.message === 'key') { store('baza_pw'); show('login'); $('loginErr').textContent = 'Неверный пароль.'; return; }
    $('status').textContent = 'Нет связи — показана сохранённая копия.';
  }
  render();
}

function openEdit(it) {
  editing = it || { id: crypto.randomUUID(), type: tab };
  const door = editing.type === 'door';
  $('editTitle').textContent = (it ? 'Изменить' : 'Добавить') + (door ? ' домофон' : ' сотрудника');
  $('doorFields').classList.toggle('hidden', !door);
  $('personFields').classList.toggle('hidden', door);
  for (const [f, k] of [['fAddr', 'addr'], ['fEntr', 'entr'], ['fCode', 'code'], ['fName', 'name'], ['fPhone', 'phone'], ['fRole', 'role'], ['fNote', 'note']]) {
    $(f).value = editing[k] || '';
  }
  $('del').classList.toggle('hidden', !it);
  show('edit');
}

async function push(rec) {
  try { await call('POST', { items: [rec] }); show('app'); render(); }
  catch (e) { alert('Не сохранилось: ' + (e.message === 'key' ? 'неверный пароль' : 'нет связи')); }
}

$('save').onclick = () => {
  const r = { id: editing.id, type: editing.type, by: load('baza_me'),
    addr: $('fAddr').value, entr: $('fEntr').value, code: $('fCode').value,
    name: $('fName').value, phone: $('fPhone').value, role: $('fRole').value, note: $('fNote').value };
  if (r.type === 'door' && !r.addr.trim()) return alert('Укажите адрес');
  if (r.type === 'person' && !r.name.trim()) return alert('Укажите ФИО');
  push(r);
};
$('del').onclick = () => { if (confirm('Удалить запись?')) push({ id: editing.id, type: editing.type, by: load('baza_me'), del: true }); };
$('cancel').onclick = () => show('app');
$('fab').onclick = () => openEdit(null);
$('tabDoor').onclick = () => { tab = 'door'; render(); };
$('tabPerson').onclick = () => { tab = 'person'; render(); };
$('q').oninput = render;
$('logout').onclick = () => { store('baza_pw'); store('baza_cache'); items = []; show('login'); };
$('enter').onclick = () => {
  store('baza_pw', $('pw').value.trim());
  store('baza_me', $('me').value.trim());
  $('loginErr').textContent = '';
  show('app'); refresh();
};

$('me').value = load('baza_me');
try { items = JSON.parse(load('baza_cache') || '[]'); } catch (e) { items = []; }
if (load('baza_pw')) { show('app'); render(); refresh(); } else show('login');
</script>
</body>
</html>
