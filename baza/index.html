<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>База бригад</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1d21; --muted:#6b7280; --line:#e3e6ea; --accent:#1565c0; --danger:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121417; --card:#1c1f24; --text:#e8eaed; --muted:#9aa0a6; --line:#2c3036; --accent:#64a9f5; --danger:#ef7070; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:4px 0 12px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .tabs button { padding:8px 6px; font-size:14px; }
  .tabs button { flex:1; }
  button, input, textarea { font:inherit; color:inherit; }
  button { border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer; }
  button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); }
  input, textarea { width:100%; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:8px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .code { font-size:22px; font-weight:700; letter-spacing:1px; }
  .muted { color:var(--muted); font-size:13px; }
  .hidden { display:none; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  a { color:var(--accent); }
  #fab { position:fixed; right:20px; bottom:20px; width:56px; height:56px; border-radius:28px; font-size:28px; padding:0; }
</style>
</head>
<body>
<main>
  <section id="login" class="hidden">
    <h1>База бригад</h1>
    <p class="muted">Коды домофонов, телефоны сотрудников, оборудование и цены, порты BDCOM по адресам. Пароль — у бригадира.</p>
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password">
    <label for="me">Ваше имя (видно, кто добавил запись)</label>
    <input id="me" placeholder="Например: Зозуля А.">
    <p><button class="primary" id="enter">Войти</button></p>
    <p id="loginErr" class="muted"></p>
  </section>

  <section id="app" class="hidden">
    <div class="row" style="margin-bottom:10px">
      <h1 style="margin:0">База бригад</h1>
      <button id="logout" style="flex:0 0 auto">Выйти</button>
    </div>
    <div class="tabs">
      <button id="tabDoor" class="on">🚪 Домофоны</button>
      <button id="tabPerson">📞 Сотрудники</button>
      <button id="tabEquip">📦 Оборудование</button>
      <button id="tabOlt">🔌 Порты</button>
    </div>
    <div class="row">
      <input id="q" type="search" placeholder="Поиск">
      <button id="pasteAddr" style="flex:0 0 auto" title="Вставить адрес, скопированный в Мобифорсе">📋 Адрес</button>
    </div>
    <p id="status" class="muted"></p>
    <div id="list"></div>
  </section>

  <section id="edit" class="hidden">
    <h1 id="editTitle"></h1>
    <div id="doorFields">
      <label for="fAddr">Адрес</label><input id="fAddr" placeholder="ст-ца Каневская, ул. Горького, 5">
      <label for="fEntr">Подъезд</label><input id="fEntr" placeholder="1">
      <label for="fCode">Код</label><input id="fCode" placeholder="1234B или 12#3456">
    </div>
    <div id="equipFields">
      <label for="fEName">Модель</label><input id="fEName" placeholder="Tenda AX12 PRO">
      <label for="fGroup">Группа</label><input id="fGroup" placeholder="Роутеры / Mesh / Камеры / Прочее">
      <label for="fPrice">Цена для абонента, ₽</label><input id="fPrice" type="number" inputmode="numeric">
      <label>Бонус за штуку, ₽: при 1–4 / 5–8 / больше 8 шт. в месяц</label>
      <div class="row"><input id="fB1" type="number" inputmode="numeric"><input id="fB5" type="number" inputmode="numeric"><input id="fB9" type="number" inputmode="numeric"></div>
    </div>
    <div id="oltFields">
      <label for="fTown">Населённый пункт</label><input id="fTown" placeholder="Новоминская">
      <label for="fStreet">Улица</label><input id="fStreet">
      <label for="fHouse">Дом</label><input id="fHouse">
      <div class="row">
        <div><label for="fOlt">BDCOM №</label><input id="fOlt" inputmode="numeric"></div>
        <div><label for="fPort">Порт</label><input id="fPort" inputmode="numeric"></div>
      </div>
      <label for="fCab">Шкаф</label><input id="fCab" placeholder="где стоит">
    </div>
    <div id="personFields">
      <label for="fName">ФИО</label><input id="fName">
      <label for="fPhone">Телефон</label><input id="fPhone" type="tel">
      <label for="fRole">Должность / бригада</label><input id="fRole">
    </div>
    <label for="fNote">Примечание</label><textarea id="fNote" rows="2"></textarea>
    <p class="row">
      <button id="cancel">Отмена</button>
      <button id="del" class="danger">Удалить</button>
      <button id="save" class="primary">Сохранить</button>
    </p>
  </section>
</main>
<button id="fab" class="primary hidden" aria-label="Добавить">+</button>

<script>
const API = '/api/baza.php';
const $ = id => document.getElementById(id);
let items = [], tab = 'door', editing = null;

function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

function show(id) {
  for (const s of ['login', 'app', 'edit']) $(s).classList.toggle('hidden', s !== id);
  $('fab').classList.toggle('hidden', id !== 'app');
}

// Сервер отдаёт только изменённое с прошлого раза (since); "full" — пришла вся база.
async function call(method, body) {
  const since = items.length ? load('baza_since') : '';
  const r = await fetch(API + (since ? '?since=' + since : ''), {
    method, headers: { 'X-Key': load('baza_pw'), 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined, cache: 'no-store'
  });
  if (r.status === 403) throw new Error('key');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  if (data.full !== false) {
    items = data.items || [];
  } else {
    const byId = new Map(items.map(i => [i.id, i]));
    for (const it of data.items || []) byId.set(it.id, it);
    items = [...byId.values()];
  }
  store('baza_cache', JSON.stringify(items));
  if (data.now) store('baza_since', String(data.now));
}

// Поиск без «ул.», «д.», «ст-ца»…: «горького 5» найдёт «ст-ца Каневская, ул. Горького, д. 5»
const STOP = new Set(['ст-ца', 'станица', 'ул', 'улица', 'пер', 'переулок', 'д', 'дом', 'х', 'хутор', 'пос', 'подъезд']);
const norm = s => (s || '').toLowerCase().replace(/ё/g, 'е').replace(/[.,]/g, ' ')
  .split(/\s+/).filter(w => w && !STOP.has(w)).join(' ');

function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render() {
  $('tabDoor').classList.toggle('on', tab === 'door');
  $('tabPerson').classList.toggle('on', tab === 'person');
  $('tabEquip').classList.toggle('on', tab === 'equip');
  $('tabOlt').classList.toggle('on', tab === 'olt');
  $('q').placeholder = tab === 'olt' ? 'Улица и дом: «советская 99» — покажет соседние дома' : 'Поиск';
  if (tab === 'olt') return renderOlt();
  const q = norm($('q').value).split(' ').filter(Boolean);
  const list = items.filter(it => it.type === tab && !it.del)
    .filter(it => {
      const hay = norm([it.addr, it.entr, it.code, it.name, it.phone, it.role, it.group, it.note].join(' '));
      return q.every(w => hay.includes(w));
    })
    .sort((a, b) => ((a.group || '') + (a.addr || a.name || '')).localeCompare((b.group || '') + (b.addr || b.name || ''), 'ru'));
  const money = n => (n || 0).toLocaleString('ru-RU') + ' ₽';
  $('list').innerHTML = list.map(it => tab === 'door'
    ? `<div class="card" data-id="${esc(it.id)}">
         <div>${esc(it.addr)}${it.entr ? ', подъезд ' + esc(it.entr) : ''}</div>
         <div class="code">${esc(it.code) || '—'}</div>
         ${it.note ? `<div class="muted">${esc(it.note)}</div>` : ''}
         <div class="muted">${esc(it.by)} · ${new Date(it.at).toLocaleDateString('ru-RU')}</div>
       </div>`
    : tab === 'equip'
    ? `<div class="card" data-id="${esc(it.id)}">
         <div class="muted">${esc(it.group)}</div>
         <div class="row"><b>${esc(it.name)}</b><span style="text-align:right;flex:0 0 auto" class="code">${money(it.price)}</span></div>
         <div class="muted">${it.bonus || it.bonus5 || it.bonus9 ? `Бонус: ${it.bonus} / ${it.bonus5} / ${it.bonus9} ₽ (1–4 / 5–8 / >8 шт.)` : 'Без бонуса'}</div>
         ${it.note ? `<div class="muted">${esc(it.note)}</div>` : ''}
       </div>`
    : `<div class="card" data-id="${esc(it.id)}">
         <div><b>${esc(it.name)}</b>${it.role ? ' — ' + esc(it.role) : ''}</div>
         ${it.phone ? `<div><a href="tel:${esc(it.phone.replace(/[^\d+]/g, ''))}">${esc(it.phone)}</a></div>` : ''}
         ${it.note ? `<div class="muted">${esc(it.note)}</div>` : ''}
       </div>`).join('') || '<p class="muted">Ничего не найдено.</p>';
  for (const el of $('list').querySelectorAll('.card')) {
    el.onclick = e => { if (e.target.tagName !== 'A') openEdit(items.find(i => i.id === el.dataset.id)); };
  }
}

async function refresh() {
  $('status').textContent = 'Обновляю…';
  try { await call('GET'); $('status').textContent = ''; }
  catch (e) {
    if (e.message === 'key') { store('baza_pw'); show('login'); $('loginErr').textContent = 'Неверный пароль.'; return; }
    $('status').textContent = 'Нет связи — показана сохранённая копия.';
  }
  render();
}

function openEdit(it) {
  editing = it || { id: crypto.randomUUID(), type: tab };
  const t = editing.type;
  $('editTitle').textContent = (it ? 'Изменить' : 'Добавить') + ({ door: ' домофон', person: ' сотрудника', equip: ' оборудование', olt: ' дом → порт' })[t];
  $('oltFields').classList.toggle('hidden', t !== 'olt');
  for (const [f, k] of [['fTown', 'town'], ['fStreet', 'street'], ['fHouse', 'house'], ['fOlt', 'olt'], ['fPort', 'port'], ['fCab', 'cab']]) {
    $(f).value = editing[k] || (k === 'town' && !it ? 'Новоминская' : '');
  }
  $('doorFields').classList.toggle('hidden', t !== 'door');
  $('personFields').classList.toggle('hidden', t !== 'person');
  $('equipFields').classList.toggle('hidden', t !== 'equip');
  $('fEName').value = editing.name || ''; $('fGroup').value = editing.group || '';
  $('fPrice').value = editing.price ?? ''; $('fB1').value = editing.bonus ?? 0;
  $('fB5').value = editing.bonus5 ?? 0; $('fB9').value = editing.bonus9 ?? 0;
  for (const [f, k] of [['fAddr', 'addr'], ['fEntr', 'entr'], ['fCode', 'code'], ['fName', 'name'], ['fPhone', 'phone'], ['fRole', 'role'], ['fNote', 'note']]) {
    $(f).value = editing[k] || '';
  }
  $('del').classList.toggle('hidden', !it);
  show('edit');
}

async function push(rec) {
  try { await call('POST', { items: [rec] }); show('app'); render(); }
  catch (e) { alert('Не сохранилось: ' + (e.message === 'key' ? 'неверный пароль' : 'нет связи')); }
}

$('save').onclick = () => {
  const r = { id: editing.id, type: editing.type, by: load('baza_me'),
    addr: $('fAddr').value, entr: $('fEntr').value, code: $('fCode').value,
    name: $('fName').value, phone: $('fPhone').value, role: $('fRole').value, note: $('fNote').value };
  if (r.type === 'olt') Object.assign(r, { town: $('fTown').value, street: $('fStreet').value, house: $('fHouse').value,
    olt: $('fOlt').value, port: $('fPort').value, cab: $('fCab').value });
  if (r.type === 'olt' && (!r.street.trim() || !r.house.trim())) return alert('Укажите улицу и дом');
  if (r.type === 'equip') Object.assign(r, { name: $('fEName').value, group: $('fGroup').value,
    price: +$('fPrice').value || 0, bonus: +$('fB1').value || 0, bonus5: +$('fB5').value || 0, bonus9: +$('fB9').value || 0 });
  if (r.type === 'door' && !r.addr.trim()) return alert('Укажите адрес');
  if (r.type === 'person' && !r.name.trim()) return alert('Укажите ФИО');
  if (r.type === 'equip' && !r.name.trim()) return alert('Укажите модель');
  push(r);
};
$('del').onclick = () => { if (confirm('Удалить запись?')) push({ id: editing.id, type: editing.type, by: load('baza_me'), del: true }); };
$('cancel').onclick = () => show('app');
$('fab').onclick = () => openEdit(null);
$('tabDoor').onclick = () => { tab = 'door'; render(); };
$('tabPerson').onclick = () => { tab = 'person'; render(); };
$('tabEquip').onclick = () => { tab = 'equip'; render(); };
$('tabOlt').onclick = () => { tab = 'olt'; render(); };

// Порты: «советская 99» — дома и муфты по близости номера; «советская» — всё по улице.
const houseNum = h => parseInt(h, 10) || 0;
const oltLabel = o => /^\d+$/.test(o || '') ? 'BDCOM ' + o : (o || 'BDCOM ?');
// Муфта: насколько близко к дому target на улице streetWords (по месту и подключённым адресам)
function muffScore(m, streetWords, target) {
  if (target === null) return 0;
  let best = 1e9;
  for (const a of [m.place || ''].concat((m.abon || '').split(';'))) {
    const n = norm(a); if (!n) continue;
    if (!streetWords.every(w => n.includes(w) || norm(m.town).includes(w))) continue;
    const num = (n.match(/\d+/) || [])[0];
    if (num) best = Math.min(best, Math.abs(parseInt(num, 10) - target));
  }
  return best;
}
function renderOlt() {
  const words = norm($('q').value).split(' ').filter(Boolean);
  const numWord = words.find(w => /^\d+/.test(w));
  const target = numWord ? parseInt(numWord, 10) : null;
  const streetWords = words.filter(w => w !== numWord);
  const houses = items.filter(it => it.type === 'olt' && !it.del)
    .filter(it => { const hay = norm([it.town, it.street, it.cab, it.note].join(' ')); return streetWords.every(w => hay.includes(w)); });
  const muffs = items.filter(it => it.type === 'muff' && !it.del)
    .filter(it => { const hay = norm([it.town, it.place, it.abon, it.olt, it.num, it.note].join(' ')); return streetWords.every(w => hay.includes(w)); });
  if (!streetWords.length && target === null) {
    $('list').innerHTML = `<p class="muted">Домов в базе: ${items.filter(i => i.type === 'olt' && !i.del).length}, муфт: ${items.filter(i => i.type === 'muff' && !i.del).length}. Наберите улицу, можно с номером дома — покажу ближайшие.</p>`;
    return;
  }
  const list = houses.map(h => ({ it: h, d: target !== null ? Math.abs(houseNum(h.house) - target) : 0 }))
    .concat(muffs.map(m => ({ it: m, d: muffScore(m, streetWords, target) })))
    .filter(x => target === null || x.d < 1e9)
    .sort((a, b) => a.d - b.d || (a.it.type === 'olt' ? 0 : 1) - (b.it.type === 'olt' ? 0 : 1)
      || (a.it.street || '').localeCompare(b.it.street || '', 'ru') || houseNum(a.it.house) - houseNum(b.it.house))
    .slice(0, 80).map(x => x.it);
  $('list').innerHTML = list.map(it => it.type === 'muff'
    ? `<div class="card" data-id="${esc(it.id)}">
        <div class="row"><b>📦 Муфта ${esc(it.num)}${it.split ? ' (' + esc(it.split) + ')' : ''}</b>
          <span class="code" style="flex:0 0 auto;text-align:right;font-size:18px">${esc(it.olt)} · порт ${esc(it.port)}</span></div>
        <div class="muted">${esc(it.town)}${it.place ? ' · ' + esc(it.place) : ''}</div>
        ${it.abon ? `<div>Подключены: ${esc(it.abon.replace(/;/g, ', '))}</div>` : ''}
        ${it.note ? `<div class="muted">${esc(it.note)}</div>` : ''}
        ${it.lat ? `<div><a href="https://yandex.ru/maps/?pt=${it.lon},${it.lat}&z=18&l=map" target="_blank" rel="noopener">📍 На карте</a></div>` : ''}
      </div>`
    : `<div class="card" data-id="${esc(it.id)}">
        <div class="row"><b>${esc(it.street)}, ${esc(it.house)}</b>
          <span class="code" style="flex:0 0 auto;text-align:right">${esc(oltLabel(it.olt))}${it.port ? ' · порт ' + esc(it.port) : ''}</span></div>
        <div class="muted">${esc(it.town)}${it.cab ? ' · ' + esc(it.cab) : ''}</div>
        ${it.note ? `<div class="muted">${esc(it.note)}</div>` : ''}
      </div>`).join('') || '<p class="muted">Ничего не найдено.</p>';
  for (const el of $('list').querySelectorAll('.card')) el.onclick = e => {
    if (e.target.tagName === 'A') return;
    const it = items.find(i => i.id === el.dataset.id);
    if (it.type === 'olt') openEdit(it);
  };
}
// Адрес из Мобифорса: «353700, Краснодарский край, Каневской р-н, ст-ца Новоминская, ул Космонавтов, д 26, кв 7»
// → «Новоминская Космонавтов 26». Не похоже на адрес — null.
function addressQuery(text, withTown = true) {
  const parts = text.replace(/\n/g, ',').split(',').map(p => p.trim()).filter(Boolean);
  if (parts.length < 2) return null;
  let town = '', street = '', house = '';
  for (const p of parts) {
    if (/^\d{6}$/.test(p) || /(край|обл\.?|область|р-н|район)$/i.test(p) ||
        /^(кв\.?|квартира|оф\.?|офис|корп\.?|стр\.?|подъезд|эт\.?)\s*\d/i.test(p)) continue;
    const t = p.match(/^(ст-ца|станица|х\.?|хутор|пос\.?|посёлок|поселок|п\.|с\.|село|г\.?|город)\s+/i);
    const st = p.match(/^(ул\.?|улица|пер\.?|переулок|пр-кт|проспект|пр-д|проезд|пл\.?|площадь|б-р|бульвар|туп\.?|тупик|мкр\.?)\s+/i);
    const h = p.match(/^(д\.?|дом)\s*(?=\d)/i);
    if (t) town = p.slice(t[0].length);
    else if (st) street = p.slice(st[0].length);
    else if (h) house = p.slice(h[0].length).replace(/ /g, '');
    else if (!house && street && /^\d/.test(p)) house = p.replace(/ /g, '');
    else if (!street && town) street = p;
  }
  if (!street) return null;
  return [withTown ? town : '', street, house].filter(Boolean).join(' ');
}
const looksFull = s => s.includes(',') && (/\d{6}/.test(s) || /край|р-н/i.test(s));
function setQuery(q) { $('q').value = q; render(); }
$('q').oninput = () => {
  const v = $('q').value;
  const q = looksFull(v) ? addressQuery(v) : null;
  if (q) $('q').value = q;
  render();
};
$('pasteAddr').onclick = async () => {
  let raw = '';
  try { raw = (await navigator.clipboard.readText()).trim(); }
  catch (e) { alert('Браузер не дал прочитать буфер — вставьте адрес в поиск вручную (долгое нажатие → Вставить).'); return; }
  if (!raw) return alert('Буфер пуст — скопируйте адрес в Мобифорсе');
  if (tab === 'person') tab = 'olt';
  const q = addressQuery(raw) || raw.replace(/\s+/g, ' ');
  setQuery(q);
  if (tab === 'olt' && !$('list').querySelector('.card')) {
    const noTown = addressQuery(raw, false);
    const street = noTown && noTown.split(' ').filter(w => !/^\d/.test(w)).join(' ');
    for (const f of [noTown, street]) { if (!f) continue; setQuery(f); if ($('list').querySelector('.card')) break; }
  }
};
$('logout').onclick = () => { store('baza_pw'); store('baza_cache'); store('baza_since'); items = []; show('login'); };
$('enter').onclick = () => {
  store('baza_pw', $('pw').value.trim());
  store('baza_me', $('me').value.trim());
  $('loginErr').textContent = '';
  show('app'); refresh();
};

$('me').value = load('baza_me');
try { items = JSON.parse(load('baza_cache') || '[]'); } catch (e) { items = []; }
if (load('baza_pw')) { show('app'); render(); refresh(); } else show('login');
</script>
</body>
</html>
